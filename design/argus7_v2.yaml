# ARGUS-7 v2.0 - OPTIMISED, MTOW-CONSTRAINED DESIGN POINT
#
# Produced 2026-08-21 by argus7/opt/ under the honest model: part-load BSFC,
# engine rating as a design variable against a 2 m/s sea-level climb
# constraint, and the CORRECTED wing tank model.
#
# MTOW capped at 250 kg to stay in the same regulatory band as v1.0, so this is
# a like-for-like comparison rather than a bigger aeroplane.
#
#   published v1.0, honest model : 3.16 d, and INFEASIBLE (needs 101.5 kg of
#                                  fuel, wing holds 66.1 kg)
#   this design                  : 4.88 d, feasible with 37.6 kg of tank margin
#
# The single largest lever is the ENGINE, not the airframe: 17 kW -> 8.15 kW
# lifts loiter load fraction from 19% to 33% and drops effective BSFC from
# 425 to 328 g/kWh. v1.0's engine is sized for climb and then spends 122 hours
# at a fifth of its rating.
#
# The climb constraint is exactly active: 8.11 kW required, 8.15 kW installed.
# NOTE the report's separate finding that the propeller cannot absorb its rated
# power (C_P 0.911 vs a ~0.25 ceiling) is NOT yet modelled here.
#
# Tail area holds v1.0's tail volume coefficient Vh = 0.5765.
#
# PROPELLER (BEMT sweep, 2026-08-21): 1.00 m, 2 blades, 1900 rpm, p/D 1.05.
# eta_loiter 0.852, absorbs 99.0% of the 8.15 kW rating at climb, tip Mach 0.30,
# 76 mm boom clearance. The 1.04 m disc is 0.6% more efficient but leaves only
# 56 mm, so the smaller disc is preferred on clearance grounds.
# Reduction 3.95:1 for a 7500 rpm engine, NOT the 2.3:1 v1.0 specified.
# Variable pitch buys ZERO at loiter - the loiter-optimal pitch is already the
# fixed-pitch optimum - so it is mass, cost and a failure mode for nothing.

