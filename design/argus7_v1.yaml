# ARGUS-7 v1.0 parameter file.
#
# Provenance is field-level, not file-level: see the `provenance:` block
# below (checked by tests/test_geometry_closure.py::
# test_every_geometry_field_has_provenance) rather than trusting any
# whole-file claim. Tags:
#   report-§2    verbatim/unambiguous from docs/argus7_design_report.md
#                section 2, including its tail-volume inconsistency (see
#                test_report_stated_tail_volume) — not "fixed" here.
#   design_pack-§1  from research/design_pack.md section 1. NOT used below:
#                that pack describes the 200 kg AR-20 predecessor, a
#                different aircraft, and none of v1.0's numbers come from it.
#   derived      not authoritative as written; a later task computes it from
#                other Design fields (wing.thickness_ratio will be
#                cross-checked against loaded FX63-137 airfoil coordinates
#                in Task 2 rather than trusted as a bare digit of the
#                airfoil name). booms.length_m was deleted as a Design
#                field entirely in Task 4 (ruling P15): it is now
#                computed geometry (argus7.design.geometry.derive_booms),
#                not an input, so it carries no provenance tag.
#   assumption   appears in neither the report nor the design pack. Several
#                of these (fuselage.*, booms.diameter_m, booms.y_station_frac,
#                tail.dihedral_deg, tail.taper_ratio, tail.airfoil) were
#                carried over from model/argus7_model.scad, the defective
#                artifact this phase replaces — kept as placeholder values,
#                explicitly flagged non-authoritative rather than
#                mislabeled as report-derived.
name: ARGUS-7
variant: v1.0

mission:
  payload_mass_kg: 50.0
  payload_power_w: 500.0
  loiter_altitude_m: 4000.0

wing:
  area_m2: 3.9
  aspect_ratio: 22.0
  taper_ratio: 0.45
  airfoil: FX63-137
  twist_tip_deg: -3.0
  dihedral_deg: 3.0
  sweep_le_deg: 1.0
  thickness_ratio: 0.137
  incidence_deg: 2.0
  # Vertical offset of the wing root leading edge above the fuselage
  # centreline (z = 0, which is also the boom axis). FINAL REVIEW C1: this
  # was a bare 0.05 typed into argus7.cad.model.build_aircraft and a second
  # time into argus7.cad.to_openscad, and at 0.05 m it held the wing's lower
  # surface 25.8 mm ABOVE the top of the booms -- the booms, and the entire
  # tail they carry, were a free-floating body. 0.008 m puts the wing's
  # measured lower surface at z = 0.0255 m at the boom station (y = 0.6206 m),
  # letting the top 19.5 mm -- 21.7% of the boom's 90 mm diameter -- into the
  # wing, which is a real structural joint (see
  # research/materials_pack.md's printed wing-boom junction fillets) while
  # leaving the wing clear of the boom centreline: the wing section is only
  # 73.7 mm thick there, so a 90 mm tube cannot pass through it.
  # Guarded by tests/test_cad_airframe.py::test_wing_captures_the_booms.
  z_offset_m: 0.008

fuselage:
  length_m: 3.4
  max_diameter_m: 0.48
  # (x_fraction, radius_fraction) OML loft stations, nose to tail.
  stations:
    - [0.00, 0.15]
    - [0.08, 0.62]
    - [0.22, 1.00]
    - [0.55, 0.96]
    - [0.80, 0.70]
    - [1.00, 0.34]
booms:    {diameter_m: 0.09, y_station_frac: 0.134, clearance_m: 0.15}
tail:     {type: inverted_v, area_h_m2: 0.31, arm_m: 3.2,
           dihedral_deg: -42.0, taper_ratio: 0.55, airfoil: NACA0010,
           panel_aspect_ratio: 3.0}
propulsion: {engine_displacement_cc: 250.0, power_max_kw: 17.0,
             reduction_ratio: 2.3, prop_diameter_m: 0.813, prop_rpm: 2100.0}
masses:   {airframe: 60.5, powertrain: 25.0, avionics: 6.0, recovery: 7.0,
           payload: 50.0, fuel: 101.5, mtow: 250.0}
aero:     {cd0: 0.020, oswald_e: 0.85, cl_max: 1.6}

provenance:
  wing.area_m2: report-§2
  wing.aspect_ratio: report-§2
  wing.taper_ratio: report-§2
  wing.airfoil: report-§2
  wing.thickness_ratio: derived
  wing.twist_tip_deg: assumption
  wing.dihedral_deg: assumption
  wing.sweep_le_deg: assumption
  wing.incidence_deg: assumption
  wing.z_offset_m: assumption
  fuselage.length_m: assumption
  fuselage.max_diameter_m: assumption
  fuselage.stations: assumption
  booms.diameter_m: assumption
  booms.y_station_frac: assumption
  booms.clearance_m: assumption
  tail.type: report-§2
  tail.area_h_m2: report-§2
  tail.arm_m: report-§2
  tail.dihedral_deg: assumption
  tail.taper_ratio: assumption
  tail.airfoil: assumption
  tail.panel_aspect_ratio: assumption
  propulsion.engine_displacement_cc: report-§2
  propulsion.power_max_kw: report-§2
  propulsion.reduction_ratio: report-§2
  propulsion.prop_diameter_m: report-§2
  propulsion.prop_rpm: report-§2
